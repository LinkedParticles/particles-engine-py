# CI for the linkedparticles (Engine) public repository.
#
# This repo is a per-release scrubbed export of a private development upstream
# (see CONTRIBUTING.md). These workflows are authored in that upstream under
# publish/overlays/ and laid into the exported tree by the release export —
# edit them there, not on the public repo (a direct edit here is overwritten by
# the next export).
#
# Supply-chain convention (matches the upstream): every `uses:` is pinned to a
# full 40-char commit SHA, never a mutable `@vN` tag; the trailing `# vN`
# comment is the human-readable tag that SHA resolves to. Bump a SHA only
# deliberately.
#
# Scope note — DCO, the docs build, pytest, and the projection drift gate all
# run. One check is still deferred:
#   * ruff — the export's citation-strip rewrite still joins a citation wrapped
#     across a line boundary into an over-length line, a lint + format issue in
#     the exported copy only. The import-grouping half is fixed (the pyproject
#     declares isort known-first-party = ["particles"], so `particles.core`
#     arriving from a separate distribution no longer regroups every import);
#     the ruff job lands once the reflow is too.
# `pytest` and the drift gate were both deferred on one dependency — this tree
# omits the Client substrate, which ships as the separate
# `linkedparticles-core` distribution, and neither check can import `particles`
# without it. That distribution is now on PyPI, so both jobs run; see the
# install step below for the one wrinkle that remains (the release-ordering
# window in which the exactly-matching core is not on the index yet).
# The `docs` job never shared those blockers: it installs the docs toolchain
# only, because mkdocstrings collects statically. It is also this tree's
# content gate — the guides shipped here must not link to documents this repo
# does not carry, and nothing else checks that.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every PR commit
        run: >-
          python .github/dco_check.py --range
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # The floor interpreter — pyproject says requires-python = ">=3.11",
          # so testing there is what makes that claim true.
          python-version: "3.11"
          enable-cache: false

      # Not `uv sync`, which is what the Client repository's CI runs: this
      # distribution pins `linkedparticles-core` EXACTLY (the two are one source
      # tree cut along an architectural line, so a version skew is a broken
      # install, not a compatibility question), and that pin is unresolvable
      # during one window — the Pages/CI push happens when the export PR merges,
      # while the distributions publish later, from an approval-gated GitHub
      # Release. So the exact pin is tried first and an unpinned `--override`
      # is the fallback, which is the same release-ordering seam the `docs` job
      # handles, resolved the same way: build against the newest core there is,
      # at most one release of drift, and say so in the log rather than going
      # red. Contributor PRs — every run that is not the release push itself —
      # take the exact-match path.
      - name: Install the engine and its Client layer from the index
        run: |
          set -euo pipefail
          uv venv
          v="$(sed -nE 's/^version = "(.+)"$/\1/p' pyproject.toml | head -1)"
          [ -n "$v" ] || { echo "could not read version from pyproject.toml" >&2; exit 1; }
          if uv pip install --group dev .; then
            echo "Client layer: exact match, linkedparticles-core==$v"
          else
            echo "::notice::linkedparticles-core==$v is not on the index yet \
          (the release publishes from a GitHub Release, after this push); \
          installing the newest available core."
            printf 'linkedparticles-core\n' >"$RUNNER_TEMP/core-override.txt"
            uv pip install --group dev --override "$RUNNER_TEMP/core-override.txt" .
          fi
          # Fail here, loudly, rather than inside a test collection error.
          .venv/bin/python -c "import particles.core.schema, particles.store.particle_store"

      # `not integration` is the tier that needs no API key. The integration
      # tier makes real Anthropic calls and is a developer-key concern.
      - name: Run the suite
        run: .venv/bin/pytest tests/ -m "not integration" -q

  projection-drift:
    name: projection drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: false

      # Not `uv sync`, which is what the Client repository's CI runs: this
      # distribution pins `linkedparticles-core` EXACTLY (the two are one source
      # tree cut along an architectural line, so a version skew is a broken
      # install, not a compatibility question), and that pin is unresolvable
      # during one window — the Pages/CI push happens when the export PR merges,
      # while the distributions publish later, from an approval-gated GitHub
      # Release. So the exact pin is tried first and an unpinned `--override`
      # is the fallback, which is the same release-ordering seam the `docs` job
      # handles, resolved the same way: build against the newest core there is,
      # at most one release of drift, and say so in the log rather than going
      # red. Contributor PRs — every run that is not the release push itself —
      # take the exact-match path.
      - name: Install the engine and its Client layer from the index
        run: |
          set -euo pipefail
          uv venv
          v="$(sed -nE 's/^version = "(.+)"$/\1/p' pyproject.toml | head -1)"
          [ -n "$v" ] || { echo "could not read version from pyproject.toml" >&2; exit 1; }
          if uv pip install --group dev .; then
            echo "Client layer: exact match, linkedparticles-core==$v"
          else
            echo "::notice::linkedparticles-core==$v is not on the index yet \
          (the release publishes from a GitHub Release, after this push); \
          installing the newest available core."
            printf 'linkedparticles-core\n' >"$RUNNER_TEMP/core-override.txt"
            uv pip install --group dev --override "$RUNNER_TEMP/core-override.txt" .
          fi
          # Fail here, loudly, rather than inside a test collection error.
          .venv/bin/python -c "import particles.core.schema, particles.store.particle_store"

      # The README's three projected regions are rendered FROM the store, not
      # written by hand, and this is the check that keeps that claim true in
      # public: `docs/projection/readme.corpus.jsonl` is restored into an
      # ephemeral SQLite store (created fresh, torn down after), the
      # deterministic snapshot is re-derived from the manifest's pinned
      # selection, and each region's `<!-- sources -->` trailer in README.md is
      # checked against what the store actually selects. No API key, no
      # embedding model, no owner store — everything it reads is committed
      # here, which is what makes the projection reproducible by a stranger
      # rather than only by its author.
      #
      # A failure means the README now cites a different claim set than the
      # store does. Re-splice and re-bless upstream; do not hand-edit the
      # region bodies or their trailers.
      - name: Check the projected README against the store selection
        run: .venv/bin/python scripts/projection_drift.py

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the docs toolchain
        run: python -m pip install -r docs-requirements.txt
      # Strict: an unresolvable link fails the check rather than shipping a
      # 404 to a reader. This is the same build the Pages workflow deploys.
      # The API reference documents both layers, but this tree holds only the
      # Engine half — the Client half ships as the `linkedparticles-core`
      # distribution. griffe resolves a package to ONE location and will not
      # merge a split package across search paths, so the Client half has to be
      # materialised INTO this tree. The two distributions have zero
      # overlapping files by construction, so the merge cannot collide. See the
      # header of mkdocs.yml.
      #
      # Install to a SEPARATE directory and copy the contents in. Not
      # `--target .`: pip refuses to write into a top-level directory that
      # already exists — it prints "Target directory ... already exists.
      # Specify --upgrade to force replacement", installs nothing there, and
      # still exits 0, so the build fails later with an unresolvable directive
      # rather than at the install. And `--upgrade` is not the answer either:
      # replacement means pip DELETES the existing `particles/`, taking the
      # whole Engine half with it. (`uv pip install --target` merges happily,
      # which is exactly how this divergence got shipped.)
      #
      # The version comes from this tree's own pyproject.toml, stamped by the
      # release export — one source of truth, never duplicated into
      # docs-requirements.txt where it would go stale every release.
      #
      # The fallback is the release-ordering seam: this workflow runs on push to
      # main, but the distributions are published later, from a GitHub Release
      # that waits on a manual environment approval. So on the push that lands a
      # release, the exactly-matching core does not exist on the index yet. The
      # docs then build against the newest core there is — at most one release
      # of drift, in the most stable half of the API — and say so in the log
      # rather than going red. The Publish workflow re-triggers this one when it
      # succeeds, which rebuilds against the exact match.
      - name: Materialise the Client layer for the API reference
        run: |
          set -euo pipefail
          v="$(sed -nE 's/^version = "(.+)"$/\1/p' pyproject.toml | head -1)"
          [ -n "$v" ] || { echo "could not read version from pyproject.toml" >&2; exit 1; }
          if pip install --no-deps --target "$RUNNER_TEMP/core-dist" "linkedparticles-core==$v"; then
            echo "API reference: exact match, linkedparticles-core==$v"
          else
            echo "::notice::linkedparticles-core==$v is not on the index yet \
          (the release publishes from a GitHub Release, after this push); \
          building the API reference against the newest available core."
            pip install --no-deps --target "$RUNNER_TEMP/core-dist" "linkedparticles-core"
          fi
          cp -R "$RUNNER_TEMP/core-dist/particles/." particles/
          # Fail here, loudly, rather than 40 lines later inside mkdocs.
          test -f particles/core/schema.py
          test -f particles/store/particle_store.py
      - name: Build the docs site (strict)
        run: mkdocs build --strict
