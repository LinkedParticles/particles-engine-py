suite_id: durability-seed-001
name: Event-anchored validity seed benchmark
version: 0.1.0
domain: general
source_type: TEXT
# Loose enough to absorb "end of the year" vs "Dec 31" granularity, tight enough
# that a boundary a month off still counts as wrong.
date_tolerance_days: 3
published_by: validity-benchmark seed fixtures
metrics:
  - wrong_expiry_rate
  - expiry_precision
  - expiry_recall
  - date_accuracy
cases:
  # Case 1 mixes genuine future-dated boundaries with durable facts that merely
  # MENTION a date — the danger-probe decoys the wrong_expiry_rate is over.
  - case_id: contract-and-origins
    reference_date: 2026-01-15
    document: |
      The support contract with Acme Corp runs through 2026-12-31. Acme was
      founded in 1998 by Dana Reyes. Dana met the co-founder in 2003 while
      studying in Berlin. The current promotional discount expires on
      2026-02-28. The company headquarters has been located in Austin since
      2011.
    labels:
      - content: "The support contract with Acme Corp runs through 2026-12-31."
        expected_valid_until: 2026-12-31
        is_durable: false
      - content: "The promotional discount expires on 2026-02-28."
        expected_valid_until: 2026-02-28
        is_durable: false
      - content: "Acme Corp was founded in 1998 by Dana Reyes."
        expected_valid_until: null
        is_durable: true
      - content: "Dana Reyes met the co-founder in 2003 while studying in Berlin."
        expected_valid_until: null
        is_durable: true
      - content: "Acme Corp's headquarters has been located in Austin since 2011."
        expected_valid_until: null
        is_durable: true

  # Case 2 is a scheduling note: relative boundaries that must resolve against
  # the reference_date, plus durable historical facts in the same passage.
  - case_id: scheduling-note
    reference_date: 2026-03-10
    document: |
      Reminder: the certification exam is tomorrow. The visiting professor is
      the interim department chair until 2026-08-31. Registration for the fall
      cohort opens next week. The building was renovated in 2019. The library's
      rare-books room first opened in 1962.
    labels:
      - content: "The certification exam is tomorrow (2026-03-11)."
        expected_valid_until: 2026-03-11
        is_durable: false
      - content: "The visiting professor is the interim department chair until 2026-08-31."
        expected_valid_until: 2026-08-31
        is_durable: false
      - content: "The building was renovated in 2019."
        expected_valid_until: null
        is_durable: true
      - content: "The library's rare-books room first opened in 1962."
        expected_valid_until: null
        is_durable: true

  # Case 3 is a pure durable-decoy passage — every claim mentions a date but
  # none is validity-bounded. A perfect extractor emits zero valid_until here,
  # so this case drives the wrong_expiry_rate denominator hardest.
  - case_id: all-durable-decoys
    reference_date: 2026-05-01
    document: |
      The treaty was signed in 1919. Marie Curie was born in 1867. The bridge
      was completed in 1937. The first message on the network was sent in 1969.
      The novel was published in 1851.
    labels:
      - content: "The treaty was signed in 1919."
        expected_valid_until: null
        is_durable: true
      - content: "Marie Curie was born in 1867."
        expected_valid_until: null
        is_durable: true
      - content: "The bridge was completed in 1937."
        expected_valid_until: null
        is_durable: true
      - content: "The first message on the network was sent in 1969."
        expected_valid_until: null
        is_durable: true
      - content: "The novel was published in 1851."
        expected_valid_until: null
        is_durable: true
