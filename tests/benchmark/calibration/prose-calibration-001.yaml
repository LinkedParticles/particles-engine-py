      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>Depot throughput, Q1 2026 — with corrections</title>
      </head>
      <body>
        <nav><a href="/">Home</a> · <a href="/ops">Operations</a></nav>

        <article>
          <h1>Depot throughput, Q1 2026 (with corrections)</h1>
          <p class="byline">Marek Oyelaran · posted 2 April 2026, revised 11 April 2026</p>

          <p class="correction"><strong>Correction, 11 April:</strong> the figure
          first published for Ledbury North was 18,900 pallets. That was the figure
          for Ledbury North East. Ledbury North handled 12,400. The paragraph below
          has been rewritten; the totals table has not.</p>

          <p>Ledbury North handled 12,400 pallets in Q1. Ledbury North East, which
          opened in November, handled 18,900. The two sites share a yard but are
          separately staffed, and only the latter runs a night shift.</p>

          <p>Across all five depots we moved 61,200 pallets. Readers will notice
          this does not match the totals table, which still sums to 67,700; the
          table has not yet been rebuilt and should not be quoted.</p>

          <p>Damage claims ran at 0.4 percent of pallets moved, excluding the
          Ledbury sites. Including them the rate was 0.6 percent. We report the
          lower figure in the board pack, which is a choice I have been asked to
          justify and cannot.</p>

          <p>Contrary to what was reported locally, no depot closed during the
          quarter. The Marchwood site suspended inbound receiving for nine days in
          February and has since resumed.</p>
        </article>

        <footer>© 2026 · <a href="/tags/throughput">throughput</a></footer>
      </body>
      </html>
