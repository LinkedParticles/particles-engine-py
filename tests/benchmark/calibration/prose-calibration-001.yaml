# Prose CALIBRATION suite for the general extractor.
#
# Read the header of `numismatic-calibration-001.yaml` first — it explains why
# this directory exists and why its gold sets are not §13.3 gold sets. This file
# is the third suite in the family and the first for an LLM-driven extractor,
# and it departs from the other two in two ways that are both deliberate and
# both explained below: it carries its own source bytes inline, and its gold
# coverage is TOTAL rather than partial.
#
# ---------------------------------------------------------------------------
# What this suite is for
# ---------------------------------------------------------------------------
#
# `particles extractor calibrate general-extractor` reported "No applicable
# calibration suites found" from activation until this file landed:
# the family shipped with suites for the two deterministic extractors and none
# for the fallback extractor, which is the one that mints most of a real store.
#
# The thing a suite CANNOT supply is confidence contrast —
# "a gold set creates label contrast, but spread is a property of the
# extractor's output". That is true of a gold set and false of a FIXTURE. What
# the general extractor states is a function of what it is reading, and the
# 2026-08-02 measurement behind the ADR (94 of 101 emissions at exactly 1.00,
# against `prose-article-seed-001`) is a measurement of that suite's fixtures
# as much as of the extractor. Those fixtures are engineering blog posts,
# annual results, and an interview: prose whose claims are flatly stated, so
# the extractor flatly states them back.
#
# The four fixtures here are written the other way. Every one is prose in which
# the author's own certainty varies within the document — a firm count beside an
# explicitly provisional one, a confirmed territory beside a suspected one, two
# sourced figures that disagree, an anonymous claim met with an official denial,
# a range whose width the author explains, an estimate given as odds, a printed
# correction, a total that does not reconcile. That texture is what a claim
# miner has to price, and pricing it is what produces a spread.
#
# Measured against general-extractor 0.14.0 on anthropic/claude-sonnet-5
# (2026-08-03, five runs), the four cases emit 66–69 candidates carrying nine to
# eleven distinct confidence values from 0.40 to 0.97, and **not one saturated
# emission in any run** — against 94-of-101 saturated on the §13.3 prose suite.
#(a) the fittable population is therefore N of N every time,
# where `prose-article-seed-001` leaves 7 of 101.
#
# That is the whole reason this file exists, and it is worth stating plainly
# because the ADR's measurement is read as a property of the extraction
# prompt: on this evidence it is substantially a property of the source genre.
# The prompt has a confidence vocabulary; flat prose just never exercises it.
#
# ---------------------------------------------------------------------------
# Why the gold coverage here is TOTAL, against the default
# ---------------------------------------------------------------------------
#
# §2 says target two-thirds to three-quarters of what the extractor emits, and
# the two deterministic suites do exactly that: each names all but one of its
# extractor's emissions, and the unnamed one is the negative label the fit
# learns from. That device works there because those extractors are parsers —
# they emit the same set every run, so the omission is stable and the resulting
# base rate (6/7, 5/6) is a fixed property of the file.
#
# It does not transfer here, and the reason is worth having written down before
# someone "fixes" this file to match §2. A deliberate omission labels a claim
# INCORRECT that the author knows to be correct. A temperature is then regressed
# onto stated confidence, and what it actually learns is the omission fraction
# the suite author chose: omit a quarter and the fit sees 75 % accuracy at every
# confidence level, so it fits the T that maps 0.90 toward 0.75 — a substantial
# T, improving in-sample ECE, clearing every guard, and persisted.
# It would then rewrite every future general-extractor confidence, immutably at
# creation, on the strength of a coverage fraction chosen by hand.
# That is the failure mode — a fit regressed from evidence that does
# not mean what the fit takes it to mean — reappearing in the other variable.
#
# So every claim these four fixtures support is named below. The intent is that a
# negative label means what it says — an over-emission or a genuine mis-read,
# rather than a claim the author chose not to name. That makes the labels honest
# about the *gold set*, and whatever the fit does with them is honest too.
#
# It does NOT make them noise-free, and the § Paraphrase twins section below is
# the necessary qualification: with the omissions gone, the residual negatives
# turn out to be mostly the equivalence judge failing to align a reworded
# restatement of a claim this file already names. Total coverage removes the
# error the author controls; it does not remove the one the judge introduces.
#
# ---------------------------------------------------------------------------
# What the honest labels actually produce — read this before "fixing" a refusal
# ---------------------------------------------------------------------------
#
# Measured 2026-08-03, anthropic/claude-sonnet-5: the extractor is correct on
# essentially every claim it emits from these fixtures, including the ones
# planted to be hard (a printed correction superseding a figure, two depots
# whose names differ by one word, an ambiguous "the latter", a stated total that
# does not match the table, a denial of a local report). It navigated all of
# them, twice. So the label set runs heavily — sometimes entirely — True.
#
# Four consecutive `extractor calibrate general-extractor` runs against this
# file as shipped — the first three `--dry-run`, the fourth a real one:
#
#   N=66  62 matched / 4 unmatched  T=0.7418  ECE 0.0853 → 0.0742  would persist
#   N=68  68 matched / 0 unmatched  T=0.2486  ECE 0.1112 → 0.0319  REFUSED
#                                                        (degenerate labels)
#   N=66  63 matched / 3 unmatched  T=0.6877  ECE 0.0724 → 0.0686  would persist
#   N=66  64 matched / 2 unmatched  T=0.5445  ECE 0.0936 → 0.0456  PERSISTED
#
# The fourth row is the one to look at hardest: it cleared all four guards
#, printed no warning, and wrote T=0.5445 to the extractor record. Run it
# an hour earlier and the stored value would have been 0.7418, or the run would
# have refused outright. Nothing in the output tells the operator which of those
# they got.
#
# Two things to take from that table, both load-bearing.
#
# **The direction is stable and the magnitude is not.** Every run fits T < 1 —
# sharpening, the correct direction for an extractor that states 0.60–0.90 on
# claims that are true. But T ranges over a factor of three and the *verdict*
# flips between persist and refuse on identical inputs, because the handful of
# unmatched emissions driving the label contrast are themselves run-to-run
# wording drift (see § Paraphrase twins). A value persisted here is written
# immutably at particle creation, so which run an operator happened
# to execute would permanently set every future confidence. Do not persist a
# single run of this suite.
#
# The table above was measured under the **embedding** judge, which was the
# verb's default at the time; that default was changed to the LLM judge in
# 1.121.4 and the spread narrowed without closing: T = 0.6174 and 0.4998 over
# two runs, both admissible. Two samples is not evidence of stability, and
# nothing here yet pools across runs — that is's `--runs N` lever,
# which was deliberately left out of scope. So the rule stands.
#
# **A refusal is the correct reading, not a defect in this file.** It says: on
# well-formed prose this extractor is not overconfident in the way temperature
# scaling exists to fix. The honest response to an under-confident extractor
# with essentially no errors to regress against is to store no calibration and
# keep minting EXTRACTOR_DIRECT particles at the raw stated value (
# preamble) — which is exactly what the refusal leaves in place.
#
# Do NOT respond to that refusal by deleting expectations until a temperature
# appears. That is the § Why the gold coverage here is TOTAL argument, executed
# in reverse. If you want this suite to produce a fittable population, the
# honest lever is FIXTURES THE EXTRACTOR GETS WRONG — add a case, measure it,
# and name every claim it supports.
#
# ---------------------------------------------------------------------------
# Paraphrase twins — and why a calibration label is noisier than it looks
# ---------------------------------------------------------------------------
#
# Several expectations below are marked `required: false` and restate a
# neighbouring gold in different words. They are not extra facts. They exist
# because the equivalence judge is embedding cosine at a 0.80 floor
# (`equivalence.py`), and an LLM extractor rewords the same claim between runs.
# Measured on two back-to-back runs of these fixtures, the judge scored these
# pairs — each a restatement of one claim — below the floor:
#
#   0.7915  "The Kestrel Fen Trust expects to publish…" vs "The Trust expects…"
#   0.7872  "The Cairnwell Residents' Association's tally…" vs "The Association's tally…"
#   0.7769  "One of Larkspur's largest accounts…" vs "One of the two renewing…"
#   0.5302  "Two of Larkspur's three largest accounts…" vs "Two of the platform's…"
#   0.4003  "A stuck data logger was found at station 3." vs the compound gold
#           that states the recompute and the logger together
#
# Every one is a correct emission. Without a twin each becomes an emission that
# matched no gold — which for §13.3 is a precision ding, and for calibration is
# a label saying the extractor was WRONG. A temperature regressed against those
# labels learns that the extractor errs at whatever rate its wording drifts,
# which is a fact about the judge's threshold and not about the extractor.
#
# This is the same shape as the bug that was fixed — a correct claim labelled
# incorrect for a reason that has nothing to do with correctness — arriving
# through the judge rather than through `confidence_min`. The twins are the
# containable half of it; the general problem is not fixable in a suite file and
# the fix landed in 1.121.4: `extractor calibrate` now defaults to the
# LLM equivalence judge, which adjudicates the contested [0.65, 0.80) band
# instead of rejecting it on cosine alone.
#
# The twins below are still required, for a reason worth keeping straight. The
# LLM judge is consulted only *within* that band — `equivalence.py` rejects
# anything under `llm_prefilter` (0.65) without asking — so of the five measured
# misses above, the judge now covers three (0.7915, 0.7872, 0.7769) and never
# sees the other two (0.5302, 0.4003). Those two are what the twins are for.
# Measured under the fixed default: 66/3 and 65/1 matched, against 62/4 … 68/0
# under the embedding judge — fewer false negatives, but the run-to-run spread
# in T did not disappear (0.6174, 0.4998 over two runs), so the
# "do not persist a single run" rule below still stands.
#
# Adding a twin is safe and does not inflate anything: matching is greedy 1:1,
# so a twin can only ever absorb an emission its sibling did not, and an unused
# gold is invisible to the calibration label. Add one whenever you observe a run
# emit a claim this file already names, in words the judge scores below 0.80.
#
# ---------------------------------------------------------------------------
# Why the source bytes are inline rather than `fixture:` references
# ---------------------------------------------------------------------------
#
# The other two calibration suites borrow fixtures from the conformance corpus.
# These four do not, and the reason is `fixture_corpus_hash`: adding a directory
# under `tests/conformance/fixtures/` changes the corpus hash that every stored
# ConformanceReport carries, and all nine baselines under
# `docs/conformance/baseline/` currently agree on f294b5b1… . Growing the corpus
# to house a calibration probe would make those nine mutually incomparable and
# cost a re-capture of each, for no conformance benefit — these fixtures are
# engineered to elicit hedged confidence, which is not what a field-population
# contract wants to be measured against. `source_snapshot:` + `inline_content:`
# is the techspec §13.3 default form and the loader's documented alternative, so
# the suite is self-contained instead.
#
# `confidence_min: 0.0` on every expectation is the rule, and it
# matters more here than in the sibling suites: this extractor states 0.40 on
# claims this file asserts are correct, and any real floor would demote them to
# under-confidence partial matches, which `graded` counts as
# matched anyway, but the floor would still be a claim about correctness a
# calibration suite has no business making.

