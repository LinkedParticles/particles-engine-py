        <article>
          <h1>Q3 capacity planning: draft for comment</h1>
          <p class="byline">Halvard Ceder, platform team · 8 July 2026</p>

          <p>Peak concurrent sessions on Larkspur reached 38,400 on 21 June, the
          highest we have recorded. The current cluster is provisioned for 45,000.</p>

          <p>Growth over the last two quarters has averaged 9 percent per quarter.
          If that holds we cross 45,000 in early Q4. It may not hold: two of our
          three largest accounts renew in September, and one of them has told us it
          is evaluating alternatives, so a flat quarter is a real possibility. I put
          the odds of crossing 45,000 before January at a little over half.</p>

          <p>Adding a fourth availability zone would take about six weeks and cost
          between $40,000 and $55,000 a year in standing capacity. The range is wide
          because reserved-instance pricing for the region has not been published
          for 2027.</p>

          <p>My recommendation is to defer the fourth zone until after the September
          renewals and instead raise the autoscaling ceiling, which costs nothing
          and takes an afternoon. We considered buying reserved capacity now and
          rejected it: it locks in a commitment against a demand curve we do not
          trust.</p>
        </article>

        <footer>Internal · <a href="/tags/capacity">capacity</a></footer>
      </body>
