        <article>
          <h1>Two counts, one landslip</h1>
          <p class="byline">By Ines Marchetti · 19 March 2026 · Aberlaw Messenger</p>

          <p>How many homes were damaged by the Cairnwell Brae landslip on 2 March
          depends on who is counting. Aberlaw District Council put the figure at 47
          in its situation report of 5 March. The Cairnwell Residents' Association,
          which has been door-knocking the affected streets, says the true number is
          at least 61. Neither body has published a street-by-street list.</p>

          <p>The discrepancy appears to turn on what counts as a home. The Council's
          report says it counted habitable structures only; the Association's
          spokesperson, Ruth Vance, said their tally includes any property with
          structural damage, outbuildings included.</p>

          <p>A contractor working on the slope, who asked not to be named, said
          drainage works scheduled for last autumn were postponed. Aberlaw District
          Council denies that any works were postponed, and says the drainage
          programme for the brae was always set to begin in April 2026.</p>

          <p>Nobody was injured in the landslip. Twelve households were placed in
          temporary accommodation, a figure both the Council and the Association
          agree on.</p>

          <p>The Council has commissioned an independent geotechnical review, which
          is expected to report before the end of the year.</p>
        </article>

        <footer>© 2026 Aberlaw Messenger · <a href="/tags/cairnwell">Cairnwell</a></footer>
      </body>
      </html>
