        <article>
          <h1>Thornlee Marsh transect survey: preliminary note</h1>
          <p class="byline">By Elin Okafor-Sund · 3 June 2026</p>

          <p>The Kestrel Fen Trust completed its ninth annual transect survey of
          Thornlee Marsh between 12 and 19 May 2026. Eleven transects were walked,
          the same eleven as in every year since 2018.</p>

          <h2>Counts</h2>

          <p>We logged 214 breeding pairs of reed bunting across the eleven
          transects. That is a firm count. The marsh harrier figure is not: we
          recorded four occupied territories with confidence and think there may be
          a fifth on the northern edge, but that pair was never seen carrying food
          and we are not counting it.</p>

          <p>Water levels averaged 41 cm across the season, which is roughly a third
          below the ten-year mean. The exact ten-year mean is being recomputed after
          we found a stuck logger at station 3, so the 62 cm we published last year
          should be treated as provisional.</p>

          <h2>The otter question</h2>

          <p>A volunteer reported an otter with two cubs at the eastern sluice on
          14 May. We have no photograph, no spraint from that stretch, and the
          Trust's camera trap was offline that week, so the sighting is
          unconfirmed. If it is right it would be the first otter breeding record
          for Thornlee since 2011.</p>

          <h2>What comes next</h2>

          <p>We expect to publish the full survey report in September, assuming the
          logger data can be recovered. Whether the Trust extends the survey to the
          adjoining Barrow Levels in 2027 has not been decided and depends on
          funding.</p>
        </article>

        <footer>© 2026 Kestrel Fen Trust · <a href="/tags/survey">survey</a></footer>
      </body>
      </html>
