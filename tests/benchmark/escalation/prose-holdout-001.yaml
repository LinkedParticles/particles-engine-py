        <article>
          <h1>First-half results 2026</h1>
          <p class="byline">Published 28 July 2026</p>

          <p>Skerrin Island Ferries carried 412,000 passengers in the six months
          to 30 June 2026, up from 371,000 in the same period of 2025. Vehicle
          crossings rose from 58,000 to 63,500.</p>

          <p>Revenue for the half was £9.8 million and operating profit £1.2
          million. Fuel was the largest single cost at £2.6 million.</p>

          <p>The new hybrid vessel MV Aird Mhor entered service on 3 March and
          now makes eight of the eighteen daily crossings. On those crossings it
          uses 31 percent less diesel than the vessel it replaced.</p>

          <p>Punctuality, measured as departures within five minutes of the
          timetable, was 94.2 percent. Forty-one sailings were cancelled for
          weather, against 66 in the first half of 2025.</p>

          <p>The board has approved an order for a second hybrid vessel, due in
          2028.</p>
        </article>

