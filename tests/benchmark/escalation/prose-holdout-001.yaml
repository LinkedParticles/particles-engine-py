        <title>Budget outlook 2027–28 — Ferrisford Town Council</title>
      </head>
      <body>
        <nav><a href="/">Ferrisford Town Council</a> · <a href="/budget">Budget</a></nav>

        <article>
          <h1>Budget outlook 2027–28</h1>
          <p class="byline">Office of the Town Treasurer · 1 October 2026</p>

          <p>The council's spending this year, 2026–27, is £14.2 million. For
          2027–28 we forecast a gap of between £0.9 million and £1.6 million
          between expected spending and expected income.</p>

          <p>The width of that range is mostly the leisure centre. If councillors
          vote in November to close the Ferrisford pool, the gap would fall by
          about £0.5 million a year. If they keep it open, the pool's boiler is
          expected to need replacing within two years, at an estimated cost of
          £0.8 million.</p>

          <p>We have assumed council tax rises by the maximum 4.99 percent
          allowed without a local referendum. Each percentage point below that
          adds roughly £85,000 to the gap.</p>

          <p>Our income forecast assumes car-parking revenue returns to its
          2019 level. Honestly, we think that is optimistic; it has recovered to
          about 80 percent of that level so far.</p>

          <p>A draft budget will go to full council on 9 February 2027.</p>
        </article>

        <footer>© 2026 Ferrisford Town Council</footer>
      </body>
      </html>
