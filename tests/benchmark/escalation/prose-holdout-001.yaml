      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>Moving dispatch off the nightly batch — Tamberly Freight Engineering</title>
      </head>
      <body>
        <nav><a href="/">Home</a> · <a href="/blog">Engineering blog</a> · <a href="/jobs">Careers</a></nav>

        <article>
          <h1>Moving dispatch off the nightly batch</h1>
          <p class="byline">By Ruth Abernethy-Lowe · 14 September 2026</p>

          <p>Tamberly Freight runs 260 refrigerated trucks out of three depots in
          the English Midlands. Until July 2026 our route planner ran once a
          night, at 02:00, and drivers received the next day's routes on a
          printed manifest.</p>

          <p>In July we replaced the nightly batch with an event-driven planner
          that re-plans a route whenever an order is added, cancelled or
          delayed. Each change is published to a message queue, and the planner
          recomputes only the routes that touch the affected depot.</p>

          <p>The results after eight weeks: the average time from an order being
          placed to it appearing on a driver's route fell from 19 hours to 40
          minutes. Empty running, the share of kilometres driven with no load,
          dropped from 23 percent to 17 percent.</p>

          <p>We considered buying a commercial routing service instead. We
          rejected it because none of the three vendors we spoke to supported
          temperature-zone constraints, and every one of our loads has one.</p>

          <p>The migration took a team of five engineers eleven weeks. Printed
          manifests are still produced as a backup and will be retired in
          January 2027.</p>
        </article>

        <footer>© 2026 Tamberly Freight Ltd · <a href="/tags/logistics">logistics</a> · <a href="/rss">RSS</a></footer>
      </body>
      </html>
