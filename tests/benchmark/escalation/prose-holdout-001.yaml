      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>Catalogue note: the Penhallow letter (MS 1172) — Dunmere County Record Office</title>
      </head>
      <body>
        <nav><a href="/">Dunmere Record Office</a> · <a href="/catalogue">Catalogue</a></nav>

        <article>
          <h1>Catalogue note: the Penhallow letter (MS 1172)</h1>
          <p class="byline">Dunmere County Record Office · 12 August 2026</p>

          <p>MS 1172 is a two-page letter describing the collapse of the Wheal
          Tressa mine engine house. It is unsigned. It was given to the Record
          Office in 1964 by a private donor, and nothing is known of where it
          was before that.</p>

          <p>The letter has traditionally been attributed to the mine captain
          Josiah Penhallow. The handwriting is close to that of his surviving
          account books, and the writer refers to "my men". Dr Lowenna Tresize
          has argued instead that it was written by his daughter, Keziah, who
          kept the mine's correspondence; she points out that the letter uses
          spellings found in Keziah's letters and never in Josiah's.</p>

          <p>The Record Office does not take a view. We catalogue the letter as
          "attributed to Josiah Penhallow, attribution disputed".</p>

          <p>The paper's watermark dates it to between 1838 and 1846. The
          collapse it describes is usually dated to 1841, but no newspaper report
          of it has been found.</p>
        </article>

        <footer>© 2026 Dunmere County Council</footer>
      </body>
      </html>
