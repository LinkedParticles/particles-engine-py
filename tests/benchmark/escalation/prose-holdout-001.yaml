      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>The bakery that stayed small — Long Table Review</title>
      </head>
      <body>
        <nav><a href="/">Long Table Review</a> · <a href="/essays">Essays</a></nav>

        <article>
          <h1>The bakery that stayed small</h1>
          <p class="byline">By Odile Varga · 30 August 2026</p>

          <p>Hearthwell Bakery was founded in 1994 as a cooperative by six
          bakers who had all been laid off when the Morrow &amp; Pike flour mill
          in Lindfield closed. Each member put in £2,000, and the cooperative
          still pays every member the same hourly wage.</p>

          <p>Its rivals grew. Crumbworth, which opened on the same street in
          1996, now supplies 140 supermarkets from a factory outside the town.
          Hearthwell has one shop and one oven, a wood-fired oven built in 1994
          that is still in daily use.</p>

          <p>The cooperative has twice voted against expansion: in 2008, when a
          supermarket chain offered a supply contract, and in 2019, when the
          council offered it a second unit at a reduced rent. Both votes were
          unanimous.</p>

          <p>Membership has grown only from six to eleven in thirty-two years.
          The shop sells around 900 loaves on a Saturday and closes when they
          are gone.</p>

          <p>I think Hearthwell's refusal to grow is the reason it has
          survived; a bakery that cannot be bought cheaply is a bakery nobody
          tries to buy.</p>
        </article>

        <footer>© 2026 Long Table Review</footer>
      </body>
      </html>
