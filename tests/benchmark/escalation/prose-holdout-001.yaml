      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>Five questions for Kofi Ansah-Brandt — Tideline Magazine</title>
      </head>
      <body>
        <nav><a href="/">Tideline</a> · <a href="/interviews">Interviews</a></nav>

        <article>
          <h1>Five questions for Kofi Ansah-Brandt</h1>
          <p class="byline">Interview by Saoirse Lindqvist · 2 September 2026</p>

          <p><strong>Q: What does the Corran Point station do?</strong></p>
          <p><strong>Ansah-Brandt:</strong> We measure sea level and water
          temperature at the mouth of the Corran estuary every ten minutes. The
          station has run without a gap since 1987, which makes it the longest
          unbroken record on this coast.</p>

          <p><strong>Q: What has changed since 1987?</strong></p>
          <p><strong>Ansah-Brandt:</strong> Mean sea level at the station is 11
          centimetres higher than it was in 1987. Summer surface temperature has
          risen by 1.4 degrees over the same period.</p>

          <p><strong>Q: Who runs the station?</strong></p>
          <p><strong>Ansah-Brandt:</strong> The Corran Estuary Trust owns it. I
          am the only full-time staff member; two volunteers check the sensors
          each week.</p>

          <p><strong>Q: What happens next?</strong></p>
          <p><strong>Ansah-Brandt:</strong> We are adding a salinity sensor in
          October. My own guess, and it is only a guess, is that the salt wedge
          is moving further upstream each year, but we have no data to show
          that yet.</p>
        </article>

        <footer>© 2026 Tideline Magazine</footer>
      </body>
      </html>
