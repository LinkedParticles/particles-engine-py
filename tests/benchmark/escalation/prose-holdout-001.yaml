      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>Clover undersowing trial: second-year results — Brackenridge Farm Network</title>
      </head>
      <body>
        <nav><a href="/">Brackenridge Farm Network</a> · <a href="/trials">Trials</a></nav>

        <article>
          <h1>Clover undersowing trial: second-year results</h1>
          <p class="byline">By Hamish Oyelaran · 25 September 2026</p>

          <p>Nine member farms undersowed winter wheat with white clover in 2025
          and 2026, leaving a matched strip on each farm without clover. A tenth
          farm dropped out after its strip flooded in February and is excluded
          from every figure here.</p>

          <p>Across the nine farms, nitrogen fertiliser use on the clover strips
          was 28 percent lower. Yields were between 4 percent lower and 2
          percent higher than the matched strips; the range is wide because two
          farms harvested late in wet weather.</p>

          <p>Earthworm counts were higher on the clover strips on seven of the
          nine farms, but the difference was not statistically significant and
          we would not lean on it.</p>

          <p>Our best estimate is that a farm adopting undersowing would break
          even within three seasons, though that rests on this year's fertiliser
          price and could easily be wrong.</p>

          <p>A third year is planned if funding from the regional soils fund is
          renewed in December.</p>
        </article>

        <footer>© 2026 Brackenridge Farm Network</footer>
      </body>
      </html>
