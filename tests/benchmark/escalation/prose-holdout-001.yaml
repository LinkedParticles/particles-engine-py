      </head>
      <body>
        <nav><a href="/">Vale Courier</a> · <a href="/local">Local</a> · <a href="/subscribe">Subscribe</a></nav>

        <article>
          <h1>Ashcombe Vale library reopens in former bus depot</h1>
          <p class="byline">By Tobias Mwangi-Hart · 20 September 2026</p>

          <p>Ashcombe Vale's public library reopened on Saturday in the town's
          former bus depot on Quarry Road, two years after its old building on
          the High Street closed because of subsidence.</p>

          <p>The conversion cost £3.4 million, of which £1.1 million came from a
          national lottery heritage grant and the rest from the district council.
          The new library has 1,850 square metres of floor space, about twice
          the old building's, and holds 46,000 books.</p>

          <p>It is open seven days a week, from 9:00 to 20:00 on weekdays and
          10:00 to 16:00 at weekends. The old library closed on Sundays.</p>

          <p>The former depot's inspection pit has been kept under a glass floor
          in the children's section. "We wanted people to see what the building
          used to be," said head librarian Ines Calloway.</p>

          <p>Around 1,200 people visited on the opening day. A café run by the
          Vale Community Kitchen charity will open in the building in November.</p>
        </article>

        <footer>© 2026 Vale Courier · <a href="/tags/libraries">libraries</a></footer>
