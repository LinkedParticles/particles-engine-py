      <body>
        <nav><a href="/">Calderhaven Gazette</a> · <a href="/news">News</a></nav>

        <article>
          <h1>Harbour wall repair delayed again</h1>
          <p class="byline">By Nkechi Halvorsen · 17 September 2026</p>

          <p class="correction"><em>Correction, 18 September: an earlier version
          of this article said the repair would cost £2.1 million. The
          contract value is £1.7 million; £2.1 million was the original
          estimate.</em></p>

          <p>Repairs to Calderhaven's north harbour wall, damaged in the storm of
          January 2026, will not start until spring 2027, the harbour authority
          said on Tuesday. Work had been due to start this month.</p>

          <p>The authority blamed the delay on a shortage of the granite needed
          to match the original wall. The contractor, Pendry Marine, said
          instead that the authority had not yet approved the final design, and
          that granite was available.</p>

          <p>Fishing boats have been unable to use the north berths since
          January. The harbourmaster estimates the closure has cost the fleet
          "somewhere around £300,000" in lost landings, though he said the
          figure was a rough one.</p>

          <p>A public meeting will be held at the harbour office on 2 October.</p>
        </article>

        <footer>© 2026 Calderhaven Gazette</footer>
