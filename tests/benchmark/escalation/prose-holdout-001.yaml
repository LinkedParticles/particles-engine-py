      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>Preliminary review: payments outage of 4 September — Quillon status</title>
      </head>
      <body>
        <nav><a href="/">Quillon status</a> · <a href="/history">Incident history</a></nav>

        <article>
          <h1>Preliminary review: payments outage of 4 September</h1>
          <p class="byline">Quillon Site Reliability · 8 September 2026</p>

          <p>Card payments through Quillon failed for 47 minutes on 4 September,
          from 14:12 to 14:59 UTC. That window is confirmed from our gateway
          logs. Roughly 18,000 transactions were declined; the exact figure will
          change as merchants report retries.</p>

          <p>We do not yet know the cause. Our leading hypothesis is that a
          certificate rotation on the card-network link at 14:10 left one of
          three gateway nodes presenting an expired certificate. We think this
          is likely but have not reproduced it.</p>

          <p>We have ruled out a database fault: the payments database showed
          normal latency throughout.</p>

          <p>It is unclear why traffic was not drained from the affected node
          automatically. The health check may have been testing the wrong
          endpoint, but we have not confirmed that.</p>

          <p>A full review will be published by 30 September. No customer card
          data was exposed.</p>
        </article>

        <footer>© 2026 Quillon Payments · <a href="/subscribe">Subscribe to updates</a></footer>
      </body>
      </html>
