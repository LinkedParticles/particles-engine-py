#
# Held-out prose suite for the chunk-level escalation measurement.
#
# ---------------------------------------------------------------------------
# What this file is for, and why it lives in its own directory
# ---------------------------------------------------------------------------
#
# The 2026-10-08 escalation result (docs/benchmarks/logprob-calibrator-2026-10-07.md)
# picked its disagreement cut from three tried on the same 18 article-suite
# chunks it was scored on. The follow-up asks for the cut to be fixed in advance
# and scored on a suite that played no part in choosing it. This is
# that suite.
#
# It sits in `tests/benchmark/escalation/`, a sibling of `suites/` and
# `calibration/`, so neither `particles extractor benchmark` nor
# `particles extractor calibrate` discovers it by default. A suite that a
# default verb reads is a suite something will eventually be fitted on, and
# then it is no longer held out. Run it explicitly:
#
#   uv run particles extractor benchmark general-extractor \
#       --suites-dir tests/benchmark/escalation
#
# or through `scripts/measure_escalation_holdout.py`, which is what the
# measurement uses.
#
# ---------------------------------------------------------------------------
# How it was written
# ---------------------------------------------------------------------------
#
# Ten cases, two genres, five each, because the rule under test is known to
# behave differently on them:
#
#   hold-article-*, hold-essay-*, hold-interview-*, hold-report-*
#       flat prose in the `prose-article-seed-001` register: engineering and
#       civic reporting, an essay, an interview, a results note. Claims are
#       stated flatly.
#   hold-hedged-*
#       prose in the `prose-calibration-001` register: graded certainty within
#       the document (a suspected cause beside a confirmed one, a range with
#       its reason, a disputed attribution, a printed correction, a forecast
#       conditional on a vote).
#
# Every fixture is self-authored synthetic prose. Every company, person, place
# and figure is invented except where a real place is named for colour.
# Lengths match the earlier suites (one extraction call per case, well under
# `extraction.html_chunk_size`), so "a chunk is a case" holds here as it did
# there.
#
# Gold coverage is TOTAL, the `prose-calibration-001` rule: every claim a
# fixture supports is named, so a spurious label means an over-emission or a
# mis-read rather than a claim the author chose not to list. `confidence_min`
# is 0.0 throughout, so the harness's full-match label and the calibration
# label coincide on this suite.
#
# **The gold was frozen before any model read these fixtures.** No run, local
# or hosted, was looked at while writing it, and no expectation was added or
# reworded after a run, including the paraphrase twins the sibling suites
# accumulated from observed emissions. The twins below are the ones an author
# can foresee (a compound sentence a run may split; a claim a run may state
# with or without its organisation's name). Adding a twin after seeing a
# held-out run would tune the labels to the outputs, which is the thing this
# suite exists to prevent. Any later edit bumps `version` and makes runs
# against the earlier version incomparable.

suite_id: prose-holdout-001
name: Held-out prose suite (escalation; total gold coverage)
version: 0.1.0
