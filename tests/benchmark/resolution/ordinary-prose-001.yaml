# Ordinary-prose subject-resolution gold set.
#
# A resolution-only gold set: names, the sentence each appears in, and the
# external ref the resolver should give it. It has no claim gold, so it is not
# an extractor benchmark suite and lives outside tests/benchmark/suites/, where
# suite discovery would pick it up and score claims it has no gold for.
#
# Why it exists. prose-article-seed-001's gold subjects were written around
# known resolver failures (invented companies named with ordinary words, real
# software crowded by other senses). That is the right fixture for showing a
# failure, and the wrong one for estimating how a resolver change does on
# prose nobody wrote for it. This set is the second column the default
# decision asked for: short passages in ordinary genres, read for the entities
# a writer would name in passing.
#
# How it was written, in this order, so the gold does not lean on any resolver:
#   1. Eight passages in eight genres. Facts about real entities are true and
#      well known; the people and the one internal event are invented.
#   2. Every proper-named entity in a passage is a gold subject (the
#      prose-article-seed-001 rule), and each mention is the passage sentence
#      naming it, verbatim.
#   3. Each gold ref was chosen from live Wikidata (2026-10-01) by reading the
#      candidates' descriptions, and fixed before either selection value was
#      run. A name with no item for the entity meant is null.
#
# Labelling conventions:
#   * A city takes its main item, the municipality that the English Wikipedia
#     article is attached to (Porto Q36433, not the "city seat" Q33707919).
#   * A product named as a tool takes the software item (Figma Q96186334, not
#     Figma Inc).
#   * Vitest is real but has no Wikidata item (a full-text search finds only a
#     podcast episode about it), so its gold is null.
#   * Priya and Jordan are colleagues known by first name, the private
#     referents ordinary notes are full of; null.
#   * Ottolenghi is the chef (Q8056413), although a search for the bare
#     surname does not return him among its first seven hits.

gold_set_id: ordinary-prose-001
version: 0.1.0
source_type: WEB_PAGE

passages:
  local-news-001: >-
    Cambridge City Council approved a new foot and cycle bridge over the River
    Cam near Chesterton on Tuesday. Councillor Mark Ellison said the bridge
    would take pressure off the existing crossings. Network Rail will close the
    nearby level crossing for six weeks during construction.
  tech-blog-001: >-
    We moved our frontend build from Webpack to Vite last quarter. Build times
    on GitHub Actions dropped from nine minutes to under three. We also
    replaced Jest with Vitest, because Vitest reads the same config as Vite.
    Lena Marsh, our designer, still prototypes everything in Figma first.
  travel-001: >-
    We flew from Lisbon to Porto, then took the train along the Douro River to
    Pinhão. Our guide, Rui Matos, recommended the port lodges in Vila Nova de
    Gaia. On the last day we drove north to Braga to climb the steps of Bom
    Jesus do Monte.
  business-001: >-
    Shell moved its headquarters from The Hague to London in 2022. BP has its
    head office in London as well. Both companies list their shares on the
    London Stock Exchange.
  science-001: >-
    The James Webb Space Telescope observes in infrared from an orbit around
    the second Lagrange point. It was launched on an Ariane 5 rocket from
    Kourou in French Guiana in December 2021. NASA built the telescope with the
    European Space Agency and the Canadian Space Agency.
  sports-001: >-
    Arsenal play their home matches at the Emirates Stadium in Holloway.
    Chelsea's ground is Stamford Bridge, in Fulham. Both clubs compete in the
    Premier League.
  home-blog-001: >-
    I bought a cast-iron skillet from Lodge, and it works well on the induction
    hob we got from IKEA. My neighbour Priya swears by Le Creuset, but their
    pans cost four times as much. The recipe I keep coming back to is from
    Ottolenghi.
  team-notes-001: >-
    The quarterly offsite is in Denver this year. Flights are booked on Delta,
    and the team is staying at the Brown Palace. Jordan, who joined from
    Salesforce last year, will present on the second morning.

