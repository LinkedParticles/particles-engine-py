# Mock LLM responses for the dogfood corpus.
#
# The mock LLM intercepts synthesis calls and judge calls. For each
# subject:
#   * ``synthesis`` is the prose body the mock returns when it sees the
#     synthesis prompt for that subject. ``{p0}``, ``{p1}`` etc.
#     reference particles in the order they're declared in corpus.yaml;
#     the test loader substitutes the particle's actual 8-char short ID
#     at fixture-load time so the body's `[^p-{short}]` citations
#     resolve.
#   * ``judge_verdicts`` is the JSON array the mock returns when it
#     sees the Layer B judge prompt for that subject's body. Static —
#     no particle-ID substitution needed.
#
# Subjects below the synthesis-skip threshold (Mileva, 1 particle) are
# omitted — the synthesis path never fires for them.
#
# The default-allow rule: any subject NOT in this file but encountered
# during synthesis gets a fallback "cite every particle once" response.
# So if you add a subject to corpus.yaml and want to test a specific
# synthesis outcome, add an entry here; otherwise the default applies.

TagSpaces:
  synthesis: |
    # TagSpaces

    TagSpaces is a cross-platform file tagger that stores tags in
    sidecar JSON files next to each tagged file [^p-{p0}]. It runs
    on macOS, Windows, Linux, iOS, and Android [^p-{p1}].

    The application supports tag hierarchies through a configurable
    tag library [^p-{p2}], and the Pro edition adds AI tagging via a
    local model [^p-{p3}].
  judge_verdicts:
    - {id: 0, verdict: "supports", reason: "particle backs sidecar claim"}
    - {id: 1, verdict: "supports", reason: "platform list matches"}
    - {id: 2, verdict: "supports", reason: "tag-library claim backed"}
    - {id: 3, verdict: "supports", reason: "Pro AI tagging backed"}

"1 Pfennig (1948-1950) GDR":
  synthesis: |
    # 1 Pfennig (1948-1950) GDR

    The 1 Pfennig (1948-1950) [[German Democratic Republic]] coin is
    composed of aluminium and weighs 0.75 grams [^p-{p0}]. Its
    obverse depicts an ear of wheat [^p-{p1}]. The coin was issued
    from 1948 to 1950 [^p-{p2}].
  judge_verdicts:
    - {id: 0, verdict: "supports", reason: "composition + weight backed"}
    - {id: 1, verdict: "supports", reason: "obverse design backed"}
    - {id: 2, verdict: "supports", reason: "issue dates backed"}

