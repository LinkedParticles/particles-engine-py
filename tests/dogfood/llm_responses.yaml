"DPC Messenger":
  synthesis: |
    # DPC Messenger

    DPC Messenger is a messaging system with a particle-style
    knowledge graph. It was shipped by [[Mikhashev]] on May 13, 2026
    as version 0.25.0 [^p-{p0}]. The project switched from Git's
    object model to SQLite for its knowledge-graph storage [^p-{p1}].

    For named-entity recognition the system uses GLiNER in a
    zero-shot configuration [^p-{p2}], and the knowledge graph
    participates as a retrieval channel alongside FAISS and BM25 [^p-{p3}].
  judge_verdicts:
    - {id: 0, verdict: "supports", reason: "release claim backed"}
    - {id: 1, verdict: "supports", reason: "storage switch backed"}
    - {id: 2, verdict: "supports", reason: "GLiNER claim backed"}
    - {id: 3, verdict: "supports", reason: "retrieval channel backed"}

