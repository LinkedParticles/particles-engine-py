<!-- @dsCard group="Components" name="Buttons & gestures" subtitle="Primary / secondary / danger / ghost, 3 sizes; the bus-stop gesture row" -->
<div class="p-stack">
  <div class="p-row">
    <button class="p-btn p-btn--primary">Deposit</button>
    <button class="p-btn">Cancel</button>
    <button class="p-btn p-btn--danger">Retract</button>
    <button class="p-btn p-btn--ghost">Skip</button>
    <button class="p-btn" disabled>Unavailable</button>
  </div>
  <div class="p-row">
    <button class="p-btn p-btn--primary p-btn--sm">Confirm</button>
    <button class="p-btn p-btn--sm">Copy id</button>
    <button class="p-btn p-btn--primary p-btn--lg">Get started in 5 minutes</button>
    <a class="p-btn p-btn--lg" href="#">Read the whitepaper</a>
  </div>
  <div>
    <p class="ds-h">Gesture row (curation card)</p>
    <div class="p-gestures">
      <button class="p-btn p-btn--primary">Link<span class="p-btn__note">same claim</span></button>
      <button class="p-btn">Confirm<span class="p-btn__note">keep both</span></button>
      <button class="p-btn">Supersede<span class="p-btn__note">write correction</span></button>
      <button class="p-btn p-btn--danger">Retract<span class="p-btn__note">wrong</span></button>
      <button class="p-btn p-btn--ghost">Defer</button>
    </div>
  </div>
  <p class="ds-note">One primary per view. Destructive verbs (retract, remove link) are outlined red, never filled — a filled red button reads as INCONSISTENCY. Gesture notes are the one-line reason a curator needs to pick without reading a manual.</p>
</div>
