items:
- id: 2b-008
  why: 'flagged: can move a bar'
  required: Halcyon Grid Cooperative members saw their monthly electric bills fall by between $8 and $23
    in 2025.
  nearest_emitted:
  - Depending on subscription size, Halcyon members saw monthly electric bills fall by between $8 and
    $23, with an average saving of $14 a month.
  - Halcyon Grid Cooperative's 2025 revenue was $1.62 million against operating costs of $940,000.
  - Subscribers buy generation credits from Halcyon Grid Cooperative at 8.9 cents per kilowatt-hour.
  prelabel: not_stated
  prelabel_reason: Claim 1 gives the $8-to-$23 monthly bill reduction for Halcyon members but never says
    it happened in 2025, so it is only a partial version of the required fact, and no other claim supplies
    the savings range.
  decision: agree
- id: 2b-014
  why: random audit
  required: In a normal week the shift-scheduling system at Bracken & Doyle processed roughly 30,000 shift
    assignments.
  nearest_emitted:
  - In a normal week the Bracken & Doyle shift-scheduling system processed roughly 30,000 shift assignments.
  - The Bracken & Doyle shift-scheduling system assigned shifts to about 9,000 warehouse workers across
    23 sites.
  - In 2021 Bracken & Doyle approved a full rewrite of the shift-scheduling system, budgeted at eighteen
    months.
  prelabel: stated_alone
  prelabel_reason: Claim 1 states that the Bracken & Doyle shift-scheduling system processed roughly 30,000
    shift assignments in a normal week, and it adds no other fact of substance.
  decision: agree
- id: 2b-015
  why: 'flagged: can move a bar'
  required: The rewrite of the shift-scheduling system was cancelled after fourteen months, with roughly
