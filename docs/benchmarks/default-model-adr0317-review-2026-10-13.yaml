- id: 2b-025
  why: 'flagged: can move a bar'
  required: Kaldestad believes the Meridian Rose was lost in a storm rather than by grounding.
  nearest_emitted:
  - The Meridian Rose was lost in a storm rather than by grounding; the hull shows no strike damage and
    she settled upright.
  - Kaldestad's team is confident the Meridian Rose went down in or shortly after 1687, based on dendrochronology
    and coin dates.
  - A colleague of Kaldestad reads the same evidence as indicating the Meridian Rose was overloaded.
  prelabel: not_stated
  prelabel_reason: Claim 1 states that the Meridian Rose was lost in a storm rather than by grounding
    but never attributes this view to Kaldestad, and no other claim gives Kaldestad's view on the cause
    of loss.
  decision: agree
