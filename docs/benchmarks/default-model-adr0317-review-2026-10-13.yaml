  - The rewrite of the shift-scheduling system at Bracken & Doyle spent roughly $2 million and shipped
    nothing to production.
  - In 2021, Bracken & Doyle approved a full rewrite of the shift-scheduling system, budgeted at eighteen
    months.
  prelabel: not_stated
