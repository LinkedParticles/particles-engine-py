{{- if not .Values.auth.existingSecret }}
{{- if not .Values.auth.apiKey }}
{{- fail "linkedparticles-engine: set auth.existingSecret or auth.apiKey. The engine binds 0.0.0.0, so the fail-closed gate refuses to start without a real PARTICLES_API_KEY — the pod would CrashLoopBackOff on that refusal." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "linkedparticles-engine.fullname" . }}
  labels:
    {{- include "linkedparticles-engine.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.apiKeySecretKey }}: {{ .Values.auth.apiKey | quote }}
  {{- if .Values.auth.anthropicApiKey }}
  {{ .Values.auth.anthropicApiKeySecretKey }}: {{ .Values.auth.anthropicApiKey | quote }}
  {{- end }}
{{- end }}
