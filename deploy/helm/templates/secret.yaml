{{- if not .Values.auth.existingSecret }}
{{- if and (not .Values.auth.apiKey) (not .Values.auth.keysFileOnly) }}
{{- fail "linkedparticles-engine: set auth.existingSecret or auth.apiKey, or set auth.keysFileOnly to run on per-client keys alone. The engine binds 0.0.0.0, so the fail-closed gate refuses to start without a real PARTICLES_API_KEY or a live per-client key in /data/engine-keys.json; the pod would CrashLoopBackOff on that refusal." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "linkedparticles-engine.fullname" . }}
  labels:
    {{- include "linkedparticles-engine.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.apiKey }}
  {{ .Values.auth.apiKeySecretKey }}: {{ .Values.auth.apiKey | quote }}
  {{- end }}
  {{- if .Values.auth.anthropicApiKey }}
  {{ .Values.auth.anthropicApiKeySecretKey }}: {{ .Values.auth.anthropicApiKey | quote }}
  {{- end }}
{{- end }}
