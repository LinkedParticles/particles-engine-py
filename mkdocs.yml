# mkdocs configuration for the particles-engine-py public repository — the SDK
# documentation site published at https://docs.linkedparticles.org.
#
# This repo is a per-release scrubbed export of a private development upstream
# (see CONTRIBUTING.md). This config is authored in that upstream under
# publish/overlays/ and laid into the exported tree by the release export —
# edit it there, not on the public repo (a direct edit here is overwritten by
# the next export).
#
# It is deliberately a separate file from the upstream's own mkdocs.yml: that
# one also navigates the development corpus and the standard's specification,
# neither of which is published here.
#
# This site serves NOTHING normative. The schemas, the JSON-LD context, and the
# vocabulary resolve at https://linkedparticles.org and nowhere else — those
# identifiers are permanent. Never add the schema-artifact hook to this build.
#
# Build:  pip install -r docs-requirements.txt && mkdocs build --strict

site_name: Particles Docs
site_description: Running and extending the Particles reference implementation — guides, CLI reference, and the HTTP API contract.
site_url: https://docs.linkedparticles.org
repo_url: https://github.com/LinkedParticles/particles-engine-py
repo_name: LinkedParticles/particles-engine-py

# The generated Python API reference documents BOTH layers, and this tree holds
# only one of them: everything under `particles.core` and `particles.extraction`
# ships in the `linkedparticles-core` distribution, which this tree depends on
# rather than contains.
#
# mkdocstrings resolves symbols statically, through griffe, and griffe resolves
# a package to ONE location on disk — it does not merge a `pkgutil`-style split
# package across search paths. Measured: with only this tree on the path 30 of
# the 51 directives resolve and the Client half fails; with the installed
# distribution's site-packages on the path instead, the result inverts exactly.
# Adding both paths does not help; whichever `particles` griffe finds first wins
# entirely.
#
# So the build does not point griffe at two places. It materialises the Client
# half INTO this tree first, after which `particles/` is one complete package
# and all 51 directives resolve. The two distributions share an import package
# and have zero overlapping files by construction, so the merge cannot collide.
#
# Install to a SEPARATE directory and copy the contents in. `pip --target .`
# does NOT work: pip refuses to write into a top-level directory that already
# exists, printing "Target directory ... already exists. Specify --upgrade to
# force replacement" — and still exiting 0, so the failure surfaces much later
# as an unresolvable directive. `--upgrade` is worse: replacement means pip
# deletes the existing `particles/`, taking the Engine half with it.
#
# That step lives in .github/workflows/pages.yml and ci.yml. Building these docs
# by hand needs it too:
#
#   pip install -r docs-requirements.txt
#   pip install --no-deps --target /tmp/core-dist \
#     "linkedparticles-core==$(sed -nE 's/^version = "(.+)"$/\1/p' pyproject.toml | head -1)"
#   cp -R /tmp/core-dist/particles/. particles/
#   mkdocs build --strict
#
# That copies `particles/core/` and `particles/extraction/` into the working
# tree — expected, and worth cleaning up afterwards in a checkout you intend to
# keep.

theme:
  name: material
  # Brand + palette come from the design system: hooks/copy_design_tokens.py
  # materialises stylesheets/tokens.css and assets/favicon.svg from design/,
  # and docs/stylesheets/particles.css maps every Material colour variable onto
  # the --p-* tokens (hence `primary: custom` on both schemes). The header mark
  # is a Material inline icon so its core dot takes the header ink via
  # currentColor.
  custom_dir: overrides
  icon:
    logo: particles/mark
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

hooks:
  # Copies the committed OpenAPI snapshot to docs/api/openapi.json, which the
  # HTTP API page renders client-side.
  - hooks/copy_openapi.py
  - hooks/copy_design_tokens.py

# tokens.css is generated into docs/stylesheets/ by the hook; particles.css is
# authored. Order matters: tokens first.
extra_css:
  - stylesheets/tokens.css
  - stylesheets/particles.css

copyright: >-
  © 2026 the LinkedParticles authors ·
  Apache-2.0 ·
  <a href="https://pypi.org/project/linkedparticles/">linkedparticles on PyPI</a> ·
  <a href="https://github.com/LinkedParticles/particles-engine-py/blob/main/SECURITY.md">security</a>

# Share/social metadata rendered by overrides/main.html (shared across the
# sites); the card is served from the apex site.
extra:
  social_image: https://linkedparticles.org/assets/social-card.png
  favicon_ico: assets/favicon.ico
  apple_touch_icon: assets/apple-touch-icon.png

plugins:
  - search
  # Static collection only — griffe reads source, it never imports. That is why
  # this build needs no runtime dependency closure: no torch, no Anthropic SDK,
  # no database driver. `paths: [.]` is the tree itself, which the build step
  # above has already completed with the Client half.
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            show_if_no_docstring: false
            members_order: source
            heading_level: 2

